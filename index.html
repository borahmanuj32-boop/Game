<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VenusBook App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1877f2">
<link rel="icon" href="https://i.pravatar.cc/512?img=5">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f2f5}
.header{background:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 5px #0001}
.logo{color:#1877f2;font-size:26px;font-weight:900}
.install{background:#1877f2;color:#fff;border:0;padding:8px 15px;border-radius:20px;font-weight:bold;display:none}
.main{max-width:600px;margin:10px auto;padding:0 10px}
.create{background:#fff;border-radius:15px;padding:15px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.create-top{display:flex;gap:10px;align-items:center}
.create-top img{width:40px;height:40px;border-radius:50%}
.create-top input{flex:1;background:#f0f2f5;border:0;padding:12px;border-radius:25px}
.post{background:#fff;border-radius:15px;padding:15px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.post-head{display:flex;gap:10px;align-items:center}
.post-head img{width:40px;height:40px;border-radius:50%}
.post img.post-img{width:100%;border-radius:12px;margin-top:10px;max-height:400px;object-fit:cover}
.actions{display:flex;justify-content:space-around;border-top:1px solid #eee;margin-top:10px;padding-top:8px}
.actions button{border:0;background:0;font-weight:bold;color:#65676b;flex:1;padding:10px;cursor:pointer;border-radius:10px}
.actions button:active{background:#f0f2f5}
.cbox{display:flex;gap:8px;margin-top:10px}
.cbox input{flex:1;background:#f0f2f5;border:0;padding:10px 15px;border-radius:20px}
.modal{position:fixed;inset:0;background:#0008;display:none;justify-content:center;align-items:center;z-index:200;padding:15px}
.modal.active{display:flex}
.modal-box{background:#fff;width:100%;max-width:500px;border-radius:15px;padding:20px}
.btn{width:100%;background:#1877f2;color:#fff;padding:12px;border:0;border-radius:10px;font-weight:bold;margin-top:10px;cursor:pointer}
</style>
</head>
<body>

<div class="header">
<div class="logo">venusbook</div>
<button class="install" id="installBtn">📲 Install App</button>
</div>

<div class="main">
<div class="create">
<div class="create-top">
<img src="https://i.pravatar.cc/100?img=5">
<input type="text" placeholder="What's on your mind, Prabhu?" onclick="openModal()">
</div>
</div>
<div id="feed">Loading VenusBook... ⏳</div>
</div>

<div class="modal" id="modal" onclick="if(event.target==this)closeModal()">
<div class="modal-box">
<h3>Create Post 🎨</h3>
<textarea id="pText" style="width:100%;height:80px;border:1px solid #ddd;border-radius:10px;padding:10px;margin:10px 0;outline:none" placeholder="আজি কি Art বনালে?"></textarea>
<input type="file" id="pFile" accept="image/*" style="width:100%">
<button class="btn" onclick="createPost()">🚀 Post কৰক - সকলোৱে দেখিব</button>
<button onclick="closeModal()" style="width:100%;margin-top:8px;padding:10px;border:0;background:#eee;border-radius:10px">Cancel</button>
</div>
</div>

<script>
// PWA Install
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{
 e.preventDefault(); deferredPrompt=e;
 document.getElementById('installBtn').style.display='block';
});
document.getElementById('installBtn').onclick = async ()=>{
 if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; }
}

// App Logic - Local Version (Firebase লগাব বিচাৰিলে আগৰ Code দিম)
let posts = JSON.parse(localStorage.getItem('venus_app')||'[]');
if(posts.length==0){
 posts=[{id:1,name:"Venus Art Gallery Teok",time:"2h ago",text:"আজি নতুন Art বনালো! কেনে পালে জনাব দেই! 🎨❤️",img:"https://picsum.photos/600/400?random=1",likes:124,comments:[]}];
}
function render(){
 let h="";
 posts.forEach(p=>{
  h+=`<div class="post"><div class="post-head"><img src="https://i.pravatar.cc/100?u=${p.id}"><div><b>${p.name}</b><br><small>${p.time}</small></div></div><div style="margin:10px 0">${p.text}</div>${p.img?`<img class="post-img" src="${p.img}">`:''}<div class="actions"><button onclick="like(${p.id})">👍 Like (${p.likes})</button><button onclick="document.getElementById('c${p.id}').focus()">💬 Comment</button><button>↗️ Share</button></div><div class="cbox"><input id="c${p.id}" placeholder="Photo Comment লিখক..."><button onclick="comment(${p.id})" style="background:#1877f2;color:#fff;border:0;padding:8px 15px;border-radius:20px">Post</button></div>${p.comments.map(c=>`<div style="background:#f0f2f5;padding:8px 12px;border-radius:15px;margin:5px 0;font-size:14px">${c}</div>`).join('')}</div>`;
 });
 document.getElementById('feed').innerHTML=h;
 localStorage.setItem('venus_app',JSON.stringify(posts));
}
window.like=(id)=>{let p=posts.find(x=>x.id==id);p.likes++;render();}
window.comment=(id)=>{let i=document.getElementById('c'+id);if(!i.value)return;posts.find(x=>x.id==id).comments.push(i.value);i.value="";render();}
window.openModal=()=>document.getElementById('modal').classList.add('active');
window.closeModal=()=>document.getElementById('modal').classList.remove('active');
window.createPost=()=>{let t=document.getElementById('pText').value;let f=document.getElementById('pFile').files[0];if(!t&&!f)return alert("কিবা লিখক!");let img="";if(f)img=URL.createObjectURL(f);posts.unshift({id:Date.now(),name:"Anuj Borah",time:"Just now",text:t,img:img,likes:0,comments:[]});closeModal();document.getElementById('pText').value="";render();}
render();

// Service Worker
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
