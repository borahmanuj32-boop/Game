<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VenusBook - Live</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f2f5}
.header{background:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 5px #0001}
.logo{color:#1877f2;font-size:26px;font-weight:900}
.main{max-width:600px;margin:10px auto;padding:0 10px}
.create{background:#fff;border-radius:10px;padding:15px;margin-bottom:12px}
.create-top{display:flex;gap:10px}
.create-top img{width:40px;height:40px;border-radius:50%}
.create-top input{flex:1;background:#f0f2f5;border:0;padding:12px;border-radius:20px}
.post{background:#fff;border-radius:10px;padding:15px;margin-bottom:12px}
.post-head{display:flex;gap:10px;align-items:center}
.post-head img{width:40px;height:40px;border-radius:50%}
.post img{width:100%;border-radius:10px;margin-top:10px;max-height:400px;object-fit:cover}
.actions{display:flex;justify-content:space-around;border-top:1px solid #eee;margin-top:10px;padding-top:8px}
.actions button{border:0;background:0;font-weight:bold;color:#65676b;flex:1;padding:8px;cursor:pointer}
.comments{margin-top:10px}
.comment{display:flex;gap:8px;margin:6px 0}
.comment div{background:#f0f2f5;padding:8px 12px;border-radius:15px;font-size:14px;max-width:85%}
.comment img{width:100%;border-radius:10px;margin-top:5px;max-width:150px}
.cbox{display:flex;gap:8px;margin-top:10px;align-items:center}
.cbox input{flex:1;background:#f0f2f5;border:0;padding:10px 15px;border-radius:20px}
.cbox label{background:#e4e6eb;padding:8px 12px;border-radius:20px;cursor:pointer}
.modal{position:fixed;inset:0;background:#0008;display:none;justify-content:center;align-items:center;z-index:200;padding:15px}
.modal.active{display:flex}
.modal-box{background:#fff;width:100%;max-width:500px;border-radius:10px;padding:20px}
.modal-box textarea{width:100%;height:80px;border:0;outline:none;font-size:18px}
.btn{width:100%;background:#1877f2;color:#fff;padding:12px;border:0;border-radius:10px;font-weight:bold;margin-top:10px;cursor:pointer}
</style>
</head>
<body>

<div class="header"><div class="logo">venusbook</div><div>Live 🌐</div></div>

<div class="main">
<div class="create">
<div class="create-top">
<img src="https://i.pravatar.cc/100?img=5">
<input type="text" placeholder="What's on your mind, Prabhu?" onclick="openModal()">
</div>
</div>
<div id="feed">Loading... ⏳</div>
</div>

<div class="modal" id="modal" onclick="if(event.target==this)closeModal()">
<div class="modal-box">
<h3>Create Post</h3>
<textarea id="pText" placeholder="কি ভাবি আছে?"></textarea>
<input type="file" id="pFile" accept="image/*">
<button class="btn" onclick="createPost()">Post - সকলোৱে দেখিব 🚀</button>
<button onclick="closeModal()" style="width:100%;margin-top:8px;padding:10px;border:0;background:#eee;border-radius:10px">Cancel</button>
</div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp, doc, updateDoc, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

// 👇 ইয়াত আপোনাৰ Firebase Config Paste কৰক 👇
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "123456789",
  appId: "YOUR_APP_ID"
};
// 👆

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

window.openModal = ()=>document.getElementById('modal').classList.add('active')
window.closeModal = ()=>document.getElementById('modal').classList.remove('active')

window.createPost = async ()=>{
 let text = document.getElementById('pText').value;
 let file = document.getElementById('pFile').files[0];
 if(!text &&!file) return alert("কিবা লিখক বা Photo দিয়ক!");
 let imgUrl = "";
 if(file){
  let r = ref(storage, 'posts/'+Date.now()+'_'+file.name);
  await uploadBytes(r,file);
  imgUrl = await getDownloadURL(r);
 }
 await addDoc(collection(db,"posts"),{name:"Venus Art Gallery",text:text,img:imgUrl,likes:0,comments:[],time:serverTimestamp()});
 document.getElementById('pText').value=""; document.getElementById('pFile').value="";
 closeModal();
}

// Live Feed - সকলোৱে একেলগে চাব
const q = query(collection(db,"posts"),orderBy("time","desc"));
onSnapshot(q,(snap)=>{
 let html="";
 snap.forEach(d=>{
  let p=d.data(); let id=d.id;
  html+=`
  <div class="post">
   <div class="post-head"><img src="https://i.pravatar.cc/100?u=${id}"><div><b>${p.name}</b><br><small>${p.time?new Date(p.time.seconds*1000).toLocaleString():'Just now'}</small></div></div>
   <div style="margin:10px 0">${p.text}</div>
   ${p.img?`<img src="${p.img}">`:''}
   <div class="actions">
    <button onclick="likePost('${id}')">👍 Like (${p.likes||0})</button>
    <button>💬 Comment (${p.comments?.length||0})</button>
   </div>
   <div class="comments">
    ${(p.comments||[]).map(c=>`<div class="comment"><div><b>${c.name}:</b> ${c.text} ${c.img?`<br><img src="${c.img}">`:''}</div></div>`).join('')}
    <div class="cbox">
     <input id="ctxt${id}" placeholder="Comment লিখক...">
     <label>📷<input type="file" id="cfile${id}" hidden accept="image/*"></label>
     <button onclick="commentPost('${id}')" style="background:#1877f2;color:#fff;border:0;padding:8px 15px;border-radius:20px">Post</button>
    </div>
   </div>
  </div>`;
 });
 document.getElementById('feed').innerHTML = html || "<p style='text-align:center'>কোনো Post নাই - প্ৰথম Post কৰক!</p>";
});

window.likePost = async (id)=>{
 await updateDoc(doc(db,"posts",id),{likes:increment(1)});
}

window.commentPost = async (id)=>{
 let txt = document.getElementById('ctxt'+id).value;
 let file = document.getElementById('cfile'+id).files[0];
 if(!txt &&!file) return;
 let imgUrl="";
 if(file){
  let r=ref(storage,'comments/'+Date.now()+'_'+file.name);
  await uploadBytes(r,file);
  imgUrl=await getDownloadURL(r);
 }
 await updateDoc(doc(db,"posts",id),{comments:arrayUnion({name:"User",text:txt,img:imgUrl})});
 document.getElementById('ctxt'+id).value="";
}
</script>
</body>
</html>
