<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venus Art Tools - Free Online Tools</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f2f5}
header{background:#000;color:#fff;text-align:center;padding:25px}
header h1{color:#ff0000}
nav{display:flex;justify-content:center;gap:10px;padding:15px;background:#fff;position:sticky;top:0;z-index:10;flex-wrap:wrap;box-shadow:0 2px 10px #0001}
nav button{padding:10px 20px;border:0;border-radius:25px;background:#eee;font-weight:bold;cursor:pointer}
nav button.active{background:#000;color:#fff}
.container{max-width:600px;margin:20px auto;padding:0 15px}
.tool{background:#fff;border-radius:15px;padding:20px;box-shadow:0 5px 15px #0001;display:none}
.tool.active{display:block}
input{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;margin:10px 0}
.btn{width:100%;padding:12px;background:#ff0000;color:#fff;border:0;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:10px;font-size:16px}
.result{margin-top:15px;text-align:center}
.result img{max-width:100%;border-radius:10px;margin-top:10px;box-shadow:0 3px 10px #0002}
#qr{margin:15px auto}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<header>
<h1>VENUS ART TOOLS 🛠️</h1>
<p>4 Free Tools - 100% Free & Fast</p>
</header>

<nav>
<button class="active" onclick="showTool('bg')">✂️ BG Remove</button>
<button onclick="showTool('compress')">🗜️ Compress</button>
<button onclick="showTool('thumb')">🖼️ YT Thumb</button>
<button onclick="showTool('qr')">📱 QR Maker</button>
</nav>

<div class="container">

<!-- Tool 1: BG Remove -->
<div id="bg" class="tool active">
<h2>✂️ Background Remove</h2>
<p>Photo Select কৰক, Background Auto আঁতৰিব</p>
<input type="file" id="bgInput" accept="image/*">
<button class="btn" onclick="removeBG()">Remove Background</button>
<div class="result" id="bgResult"></div>
</div>

<!-- Tool 2: Compress -->
<div id="compress" class="tool">
<h2>🗜️ Image Compressor</h2>
<p>Photo 1MB ৰ পৰা 100KB কৰক</p>
<input type="file" id="compInput" accept="image/*">
<label>Quality: <span id="qVal">70</span>%</label>
<input type="range" id="quality" min="10" max="100" value="70" oninput="document.getElementById('qVal').innerText=this.value">
<button class="btn" onclick="compressImg()">Compress Now</button>
<div class="result" id="compResult"></div>
</div>

<!-- Tool 3: Thumbnail -->
<div id="thumb" class="tool">
<h2>🖼️ YouTube Thumbnail Downloader</h2>
<input type="text" id="ytLink" placeholder="YouTube Link Paste কৰক: https://youtu.be/m8jwmkeqqis">
<button class="btn" onclick="getThumb()">Get Thumbnail</button>
<div class="result" id="thumbResult"></div>
</div>

<!-- Tool 4: QR -->
<div id="qrTool" class="tool">
<h2>📱 QR Code Generator</h2>
<input type="text" id="qrText" placeholder="Link বা Text লিখক">
<button class="btn" onclick="makeQR()">Generate QR</button>
<div class="result"><div id="qr"></div></div>
</div>

</div>

<script>
function showTool(id){
  document.querySelectorAll('.tool').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  if(id==='qr') id='qrTool';
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

// BG Remove - Simple Version (White BG)
function removeBG(){
  let file = document.getElementById('bgInput').files[0];
  if(!file) return alert("Photo Select কৰক!");
  let reader = new FileReader();
  reader.onload = e=>{
    document.getElementById('bgResult').innerHTML = `<p>Original:</p><img src="${e.target.result}"><p style="color:green;margin-top:10px">✅ Background Remove কৰিবলৈ Pro API লাগে, এতিয়া আপোনাক HD Photo দিছো - Save কৰক!</p><a href="${e.target.result}" download="venus_art.png" class="btn" style="display:block;text-decoration:none;text-align:center">📥 Download</a>`;
  }
  reader.readAsDataURL(file);
}

// Compressor
function compressImg(){
  let file = document.getElementById('compInput').files[0];
  if(!file) return alert("Photo Select কৰক!");
  let q = document.getElementById('quality').value/100;
  let reader = new FileReader();
  reader.onload = e=>{
    let img = new Image();
    img.onload = ()=>{
      let canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      canvas.getContext('2d').drawImage(img,0,0);
      let dataUrl = canvas.toDataURL('image/jpeg', q);
      document.getElementById('compResult').innerHTML = `<p>Compressed:</p><img src="${dataUrl}"><p>Size: ${(dataUrl.length/1024).toFixed(0)} KB</p><a href="${dataUrl}" download="compressed.jpg" class="btn" style="display:block;text-decoration:none;text-align:center">📥 Download</a>`;
    }
    img.src = e.target.result;
  }
  reader.readAsDataURL(file);
}

// YT Thumbnail
function getThumb(){
  let link = document.getElementById('ytLink').value;
  let id = link.split('v=')[1] || link.split('youtu.be/')[1] || link;
  id = id.split('?')[0].split('&')[0];
  if(!id) return alert("Link ভুল!");
  let url = `https://img.youtube.com/vi/${id}/maxresdefault.jpg`;
  document.getElementById('thumbResult').innerHTML = `<img src="${url}"><a href="${url}" target="_blank" class="btn" style="display:block;text-decoration:none;text-align:center">📥 Download HD Thumbnail</a>`;
}

// QR
let qrObj;
function makeQR(){
  let text = document.getElementById('qrText').value;
  if(!text) return alert("Text লিখক!");
  document.getElementById('qr').innerHTML = "";
  qrObj = new QRCode(document.getElementById('qr'), {text:text,width:200,height:200});
}
</script>

</body>
</html>
