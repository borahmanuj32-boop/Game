<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Venus Ludo King</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;color:white}
h1{margin:10px;color:#facc15}
#board{width:95vw;max-width:500px;aspect-ratio:1;background:white;border-radius:12px;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);border:4px solid #000;position:relative}
.cell{border:0.5px solid #ddd;display:flex;align-items:center;justify-content:center}
.home{border:2px solid #000;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px}
.r{background:#ef4444}.g{background:#22c55e}.y{background:#eab308}.b{background:#3b82f6}
.token{width:22px;height:22px;border-radius:50%;border:2px solid #000;margin:3px;cursor:pointer}
.rt{background:red}.gt{background:green}.yt{background:#ca8a04}.bt{background:blue}
#dice{width:70px;height:70px;background:white;color:black;font-size:32px;font-weight:bold;display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;margin:15px;border:2px solid #000}
#status{background:#1e293b;padding:8px 15px;border-radius:20px;margin:10px}
</style>
</head>
<body>
<h1>🎲 VENUS LUDO KING 🎲</h1>
<div id="status">🔴 RED ৰ পাল - Dice Click কৰক!</div>
<div id="board"></div>
<div id="dice">🎲</div>
<button onclick="location.reload()" style="padding:10px 20px;background:#facc15;border:none;border-radius:8px;font-weight:bold">New Game</button>
<script>
const board=document.getElementById('board'),diceEl=document.getElementById('dice'),statusEl=document.getElementById('status');
let turn=0;const colors=['r','g','y','b'],names=['🔴 RED','🟢 GREEN','🟡 YELLOW','🔵 BLUE'];let dice=1,canMove=false;
for(let r=0;r<15;r++){for(let c=0;c<15;c++){let d=document.createElement('div');d.className='cell';
if(r<6&&c<6){d.classList.add('home','r');if((r==1||r==4)&&(c==1||c==4)){let t=document.createElement('div');t.className='token rt';t.dataset.color='r';d.appendChild(t)}}
else if(r<6&&c>8){d.classList.add('home','g');if((r==1||r==4)&&(c==10||c==13)){let t=document.createElement('div');t.className='token gt';t.dataset.color='g';d.appendChild(t)}}
else if(r>8&&c<6){d.classList.add('home','y');if((r==10||r==13)&&(c==1||c==4)){let t=document.createElement('div');t.className='token yt';t.dataset.color='y';d.appendChild(t)}}
else if(r>8&&c>8){d.classList.add('home','b');if((r==10||r==13)&&(c==10||c==13)){let t=document.createElement('div');t.className='token bt';t.dataset.color='b';d.appendChild(t)}}
board.appendChild(d);}}
diceEl.onclick=()=>{if(canMove)return;dice=Math.floor(Math.random()*6)+1;diceEl.textContent=dice;canMove=true;statusEl.textContent=`${names[turn]} - ${dice} পালে!`;if(dice!=6)setTimeout(()=>{if(canMove){canMove=false;turn=(turn+1)%4;statusEl.textContent=`${names[turn]} ৰ পাল`;diceEl.textContent='🎲';}},2000);};
board.addEventListener('click',e=>{if(!e.target.classList.contains('token')||!canMove)return;if(e.target.dataset.color!=colors[turn])return;canMove=false;if(dice!=6)turn=(turn+1)%4;statusEl.textContent=`${names[turn]} ৰ পাল`;diceEl.textContent='🎲';});
</script>
</body>
  </html>
