<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venus Book - Facebook Clone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f2f5}
.header{background:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 5px #0001}
.logo{color:#1877f2;font-size:28px;font-weight:900}
.header input{padding:8px 15px;border-radius:20px;border:0;background:#f0f2f5;width:200px}
.main{max-width:600px;margin:15px auto;padding:0 10px}
.create{background:#fff;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 1px 3px #0001}
.create-top{display:flex;gap:10px;align-items:center}
.create-top img{width:40px;height:40px;border-radius:50%;background:#ddd}
.create-top input{flex:1;background:#f0f2f5;border:0;padding:12px 15px;border-radius:25px;cursor:pointer}
.create-btns{display:flex;justify-content:space-around;margin-top:12px;border-top:1px solid #eee;padding-top:10px}
.create-btns button{border:0;background:0;padding:8px 15px;border-radius:10px;font-weight:bold;cursor:pointer}
.story-bar{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}
.story{min-width:110px;height:190px;background:#fff;border-radius:15px;position:relative;overflow:hidden;box-shadow:0 1px 3px #0001;cursor:pointer;flex-shrink:0}
.story img{width:100%;height:100%;object-fit:cover}
.story p{position:absolute;bottom:5px;left:5px;color:#fff;font-weight:bold;font-size:12px;text-shadow:0 1px 3px #000}
.post{background:#fff;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 1px 3px #0001}
.post-head{display:flex;gap:10px;align-items:center}
.post-head img{width:40px;height:40px;border-radius:50%;background:#ddd}
.post-head b{font-size:15px}
.post-head span{font-size:12px;color:#666}
.post-text{margin:12px 0;font-size:16px;line-height:1.4}
.post img.post-img{width:100%;border-radius:10px;margin-top:10px;max-height:400px;object-fit:cover}
.actions{display:flex;justify-content:space-around;border-top:1px solid #eee;border-bottom:1px solid #eee;margin:12px 0;padding:8px 0}
.actions button{border:0;background:0;font-weight:bold;color:#65676b;padding:8px 15px;border-radius:5px;cursor:pointer;flex:1}
.actions button.liked{color:#1877f2}
.comments{margin-top:10px}
.comment{background:#f0f2f5;padding:8px 12px;border-radius:18px;margin:5px 0;font-size:14px}
.comment b{margin-right:5px}
.comment-box{display:flex;gap:8px;margin-top:10px}
.comment-box input{flex:1;background:#f0f2f5;border:0;padding:10px 15px;border-radius:20px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#0008;display:none;justify-content:center;align-items:center;z-index:200;padding:15px}
.modal.active{display:flex}
.modal-box{background:#fff;width:100%;max-width:500px;border-radius:10px;padding:20px}
.modal-box textarea{width:100%;height:100px;border:0;font-size:18px;resize:none;outline:none;margin:15px 0}
.modal-box input{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px}
</style>
</head>
<body>

<div class="header">
<div class="logo">venusbook</div>
<input type="text" placeholder="🔍 Search">
<div>🔔</div>
</div>

<div class="main">

<div class="create">
<div class="create-top">
<img src="https://i.pravatar.cc/100?img=5">
<input type="text" placeholder="What's on your mind, Prabhu?" onclick="openModal()">
</div>
<div class="create-btns">
<button>🔴 Live</button>
<button>🖼️ Photo</button>
<button>😊 Feeling</button>
</div>
</div>

<div class="story-bar">
<div class="story" style="background:#1877f2"><img src="https://picsum.photos/200/300?1"><p>➕ Create Story</p></div>
<div class="story"><img src="https://picsum.photos/200/300?2"><p>Anuj Borah</p></div>
<div class="story"><img src="https://picsum.photos/200/300?3"><p>Venus Art</p></div>
<div class="story"><img src="https://picsum.photos/200/300?4"><p>Teok</p></div>
</div>

<div id="feed"></div>

</div>

<div class="modal" id="modal" onclick="if(event.target==this)closeModal()">
<div class="modal-box">
<div style="display:flex;justify-content:space-between"><h3>Create Post</h3><button onclick="closeModal()" style="border:0;background:#eee;padding:5px 10px;border-radius:50%">✕</button></div>
<textarea id="postText" placeholder="What's on your mind?"></textarea>
<input type="text" id="postImg" placeholder="Photo Link (Optional) - https://...">
<button onclick="addPost()" style="width:100%;background:#1877f2;color:#fff;padding:12px;border:0;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer">Post</button>
</div>
</div>

<script>
let posts = JSON.parse(localStorage.getItem('venus_posts') || '[]');
if(posts.length==0){
 posts = [
  {id:1,name:"Venus Art Gallery Teok",time:"2h ago",text:"আজি নতুন Art বনালো! কেনে পালে জনাব দেই! 🎨❤️",img:"https://picsum.photos/600/400?random=1",likes:124,liked:false,comments:[{name:"Anuj",text:"বহুত ধুনীয়া!"}]},
  {id:2,name:"Anuj Borah",time:"5h ago",text:"Facebook ৰ দৰে App GitHub ত বনালো! 🚀",img:"https://picsum.photos/600/400?random=2",likes:89,liked:false,comments:[]}
 ];
}

function render(){
 let html="";
 posts.forEach(p=>{
  html+=`
  <div class="post">
   <div class="post-head">
    <img src="https://i.pravatar.cc/100?u=${p.id}">
    <div><b>${p.name}</b><br><span>${p.time}</span></div>
   </div>
   <div class="post-text">${p.text}</div>
   ${p.img?`<img class="post-img" src="${p.img}">`:''}
   <div style="display:flex;justify-content:space-between;padding:10px 0;color:#65676b;font-size:14px"><span>👍 ${p.likes} likes</span><span>${p.comments.length} comments</span></div>
   <div class="actions">
    <button class="${p.liked?'liked':''}" onclick="like(${p.id})">👍 Like</button>
    <button onclick="document.getElementById('cinput${p.id}').focus()">💬 Comment</button>
    <button>↗️ Share</button>
   </div>
   <div class="comments">
    ${p.comments.map(c=>`<div class="comment"><b>${c.name}:</b> ${c.text}</div>`).join('')}
    <div class="comment-box">
     <img src="https://i.pravatar.cc/100?img=5" style="width:32px;height:32px;border-radius:50%">
     <input id="cinput${p.id}" placeholder="Write a comment..." onkeydown="if(event.key==='Enter')addComment(${p.id},this.value)">
    </div>
   </div>
  </div>`;
 });
 document.getElementById('feed').innerHTML = html;
 localStorage.setItem('venus_posts',JSON.stringify(posts));
}

function like(id){
 let p = posts.find(x=>x.id==id);
 p.liked=!p.liked;
 p.likes += p.liked?1:-1;
 render();
}

function addComment(id,val){
 if(!val.trim())return;
 let p = posts.find(x=>x.id==id);
 p.comments.push({name:"You",text:val});
 render();
}

function openModal(){document.getElementById('modal').classList.add('active')}
function closeModal(){document.getElementById('modal').classList.remove('active')}

function addPost(){
 let text = document.getElementById('postText').value;
 let img = document.getElementById('postImg').value;
 if(!text.trim())return alert("কিবা লিখক!");
 posts.unshift({id:Date.now(),name:"Anuj Borah",time:"Just now",text:text,img:img,likes:0,liked:false,comments:[]});
 document.getElementById('postText').value=""; document.getElementById('postImg').value="";
 closeModal();
 render();
}

render();
</script>
</body>
</html>
